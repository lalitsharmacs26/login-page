<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        main {
            display: flex;
            min-height: 100vh;
        }

        .sidepage {
            width: 50%;
            background-image: url("bcimg.jpg.jpg");
            background-size: cover;
            background-position: center;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }

        .sidepage h1 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .sidepage p {
            font-size: 18px;
            line-height: 1.6;
        }

        .signup-page {
            width: 50%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .signup-page h2 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .signup-page p {
            text-align: center;
            color: gray;
            margin-bottom: 25px;
        }

        .signup-page input {
            width: 100%;
            padding: 15px;
            margin-bottom: 18px;
            background-color: #eff6ff;
            border: 1px solid #b8c4d4;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: 0.3s ease;
        }

        .signup-page input:focus {
            border-color: blue;
            box-shadow: 0 0 8px rgba(0, 0, 255, 0.15);
        }

        .terms {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 5px 0 20px;
        }

        .terms input {
            width: auto;
            margin: 0;
        }

        .terms label {
            font-size: 14px;
        }

        .terms a {
            color: blue;
        }

        .signup-button {
            width: 100%;
            padding: 15px;
            background-color: blue;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .signup-button:hover {
            background-color: #4338ca;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 255, 0.25);
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
        }

        .login-link a {
            color: blue;
            text-decoration: none;
            transition: 0.3s ease;
        }

        .login-link a:hover {
            color: darkblue;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            main {
                flex-direction: column;
            }

            .sidepage,
            .signup-page {
                width: 100%;
            }

            .sidepage {
                min-height: 250px;
            }

            .signup-page {
                padding: 30px 20px;
            }
        }


        main {
            animation: sexySlide 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
        }


        main {
            animation: sexySlide 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes sexySlide {
            from {
                opacity: 0;
                transform: translateX(70px) scale(0.97);
                filter: blur(5px);
            }

            to {
                opacity: 1;
                transform: translateX(0) scale(1);
                filter: blur(0);
            }
        }

        main.slide-out {
            animation: slideOut 0.35s ease-in forwards;
        }

        @keyframes slideOut {
            to {
                opacity: 0;
                transform: translateX(-100px);
                filter: blur(3px);
            }
        }
    </style>
</head>

<body>

    <main>
        <section class="sidepage">
            <h1>Create Account!</h1>
            <p>Join us today and start<br>your journey with us.</p>
        </section>

        <section class="signup-page">
            <h2>Sign Up</h2>
            <p>Create your account to get started.</p>

            <form>
                <input type="text" placeholder="Full name" required>

                <input type="email" placeholder="Email address" required>

                <input type="password" placeholder="Create password" required>

                <input type="password" placeholder="Confirm password" required>

                <div class="terms">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">
                        I agree to the <a href="#">Terms & Conditions</a>
                    </label>
                </div>

                <button class="signup-button" type="submit">
                    Create Account
                </button>
            </form>

            <div class="login-link">
                Already have an account?
                <a href="index2.html">Login</a>
            </div>
        </section>
    </main>

    <script>
        document.querySelectorAll('a[href="signup.html"], a[href="index.html"]').forEach(link => {
            link.addEventListener('click', function (e) {
                e.preventDefault();

                const target = this.href;
                const main = document.querySelector('main');

                main.classList.add('slide-out');

                setTimeout(() => {
                    window.location.href = target;
                }, 350);
            });
        });
    </script>

</body>

</html>
